<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 2</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

     <style>
        body {
            background: linear-gradient(135deg, #414672);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .main-container {
    max-width: 900px;
    margin: auto;
    border-radius: 0;
    border: 10px solid #6868AC;
}
        .btn{
            background-color: #6868AC;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            color: white;
        }

        .btn:hover {
            background-color: #6868AC;
        }

        #output {
            background-color: #6868AC;
            border: 2px solid #6868AC;
            border-radius: 15px;
            padding: 20px;
text-align: left;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
    </style>

</head>
<body>
    <br><br><br>
    <div class="container bg-light main-container p-5">
    <h1 class="text-center fw-bold">ICT Club👾!!</h1>
    <br><br>
    <h3 class="text-left">Add New Club Member:</h3>
    <br>
    <form>
        <div class="row">
            <div class="col">
                <label for="firstname" class="form-label"><b>First Name</b></label>
                <br>
                <input type="text" id="firstname" name="firstname" class="form-control" placeholder="Type your first name..." required>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col">
                <label for="lastname" class="form-label"><b>Last Name</b></label>
                <br>
                <input type="text" id="lastname" name="lastname" class="form-control" placeholder="Type your last name..." required>
            </div>
        </div>

        <br>
        <div class="row">
          <div class="col">
              <button class="btn w-100" type="button" py-click="addmember">Enter Name</button>
            </div>
        </div>
        <br>
        <div class="row">
            <div id="output">
                <div id="div1"></div>
                <div id ="div2"></div>
            </div>
        </div>
    </form>
    <br>
</div>
<br><br>
<script type ="py" src="main.py"></script>
</body>
</html>
